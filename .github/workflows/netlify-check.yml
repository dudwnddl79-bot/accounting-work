name: Netlify 배포 확인
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 운영 사이트와 main 비교
        run: |
          set -u
          URL=https://accounting-work.netlify.app/
          curl -sS -D headers.txt -o site.html "$URL"
          echo "--- 응답 헤더"; grep -iE "^(HTTP|date|last-modified|etag|age|x-nf-request-id|cache-status)" headers.txt || true
          echo "--- 해시"
          echo "main index.html : $(sha256sum index.html | cut -c1-16)"
          echo "운영 사이트     : $(sha256sum site.html | cut -c1-16)"
          echo "--- 업데이트 날짜: main $(grep -o 'var UD="[^"]*"' index.html) / 운영 $(grep -o 'var UD="[^"]*"' site.html)"
          echo "--- 최신본 표식"
          for s in "N월 입금채권반제(위탁비)" "var GRIDS=" "_tplResolve" "dudwnddl79-bot.github.io/accounting-work/images"; do
            echo "$s => $(grep -cF "$s" site.html || true)"
          done
          [ "$(grep -o 'var UD="[^"]*"' index.html)" = "$(grep -o 'var UD="[^"]*"' site.html)" ] || { echo "RESULT: 업데이트 날짜 불일치 (아직 배포 전)"; exit 1; }
          if cmp -s index.html site.html; then echo "RESULT: 운영 사이트 = main 최신본 (반영 완료)";
          elif grep -qF "N월 입금채권반제(위탁비)" site.html; then echo "RESULT: 최신 기본양식 반영됨 (파일은 일부 다름)";
          else echo "RESULT: 반영 안 됨"; exit 1; fi
